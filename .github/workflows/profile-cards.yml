name: Update profile cards

on:
  schedule:
    - cron: "0 6 * * *"
  push:
    paths:
      - ".github/workflows/profile-cards.yml"
  workflow_dispatch:

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=jdocdev&show_icons=true&theme=tokyonight&hide_border=true&count_private=true&locale=es
          path: assets/stats.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=jdocdev&layout=compact&theme=tokyonight&hide_border=true&locale=es
          path: assets/top-langs.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Generate streak card
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=jdocdev&theme=tokyonight&hide_border=true&locale=es
          path: assets/streak.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git commit -m "Update profile cards" || exit 0
          git push
